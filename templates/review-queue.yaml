version: 2
skill: learn-anything

settings:
  default_intervals_days: [1, 3, 7, 14, 30]
  scheduling_rule: adaptive
  start_with_retrieval: true
  allow_state_downgrade: true
  automation_enabled: false

immediate_reviews:
  - id: immediate-L01
    lesson_id: L01
    review_type: immediate
    retrieval_before_summary: true
    retrieval_prompt: ""
    transfer_task: ""
    result: not_attempted
    misconceptions_reactivated: []
    next_action: reinforce
    completed_at: null

queue:
  - id: review-001
    node_id: node-001
    node_name: ""
    knowledge_type: concept
    importance: core
    due_at: null
    interval_days: 1
    reason: new_learning
    target_status: independent
    retrieval_prompt: ""
    expected_evidence: ""
    answer_key_or_rubric: ""
    transfer_variant: ""
    last_result: not_attempted
    last_hint_level: null
    error_count: 0
    confidence_before: null
    confidence_after: null
    status: pending

history:
  - timestamp: null
    review_id: review-001
    node_id: node-001
    prompt_used: ""
    result: not_attempted
    hint_level: null
    observed_errors: []
    mastery_change:
      from: unknown
      to: unknown
    next_interval_days: null
    next_due_at: null
    scheduling_rationale: ""

scheduling_rules:
  new_or_fragile:
    default_next_days: 1
    condition: "Acaba de aprenderlo, persiste un error o necesita mucha ayuda"
  correct_but_hesitant:
    default_next_days: 3
    condition: "Acertó con poca confianza, una explicación débil o una demora considerable"
  independent_success:
    default_next_days: 7
    condition: "Resuelve una tarea representativa sin pistas decisivas"
  transfer_success:
    default_next_days: 14
    condition: "Aplica lo aprendido en un contexto nuevo y explica sus límites"
  durable_success:
    default_next_days: 30
    condition: "Recuerda y aplica lo aprendido de manera estable después de un intervalo"
  failure:
    default_next_days: 1
    condition: "Falla el recuerdo, reaparece un error central o hace falta mucha ayuda"
    action: "Reduce el nivel de dominio o marca para refuerzo. Corrige el error antes de programar otro repaso."

session_opening:
  due_item_limit: 3
  priority_order:
    - overdue_core
    - active_misconception
    - due_core
    - due_supporting
  rule: "Pide al estudiante que recuerde o aplique lo aprendido antes de mostrar las notas y respuestas anteriores"

session_closing:
  report_fields:
    - reviewed_items
    - retrieval_results
    - misconceptions_reactivated
    - mastery_changes
    - next_due_items

provenance:
  created_at: null
  updated_at: null
  learner_state_path: null
  notes: []
